name: Upstream sync

# Merge dmmulroy/anti-slop `main` into a `sync/upstream` branch and open or
# update a PR. On a merge conflict, open or update an issue instead. Never
# pushes to `main`.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/dmmulroy/anti-slop.git
  SYNC_BRANCH: sync/upstream
  CONFLICT_TITLE: "Upstream sync: merge conflict with dmmulroy/anti-slop"

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # Optional repo secret: a fine-grained PAT (Contents, Pull requests,
      # Issues, Workflows: read and write on this repo). With it, sync PRs
      # trigger CI and merges that touch `.github/workflows/` can be pushed.
      # Without it, the default GITHUB_TOKEN is used.
      GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Fetch upstream
        id: fetch
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream main
          sha="$(git rev-parse upstream/main)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "behind=false" >> "$GITHUB_OUTPUT"
            echo "main already contains upstream/main ($sha)."
          else
            echo "behind=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream/main
        id: merge
        if: steps.fetch.outputs.behind == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --force-create "$SYNC_BRANCH"
          if git merge --no-edit upstream/main; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            {
              echo "conflict=true"
              echo "files<<EOF"
              git diff --name-only --diff-filter=U
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            git merge --abort
          fi

      - name: Push branch and open or update PR
        if: steps.merge.outputs.conflict == 'false'
        env:
          SHA: ${{ steps.fetch.outputs.sha }}
        run: |
          git push --force origin "$SYNC_BRANCH"
          title="Sync upstream dmmulroy/anti-slop@${SHA:0:7}"
          body="Merges [dmmulroy/anti-slop@${SHA}](https://github.com/dmmulroy/anti-slop/commit/${SHA}) into \`main\`. Generated by the upstream sync workflow."
          pr="$(gh pr list --head "$SYNC_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body "$body"
          else
            gh pr create --head "$SYNC_BRANCH" --base main --title "$title" --body "$body"
          fi

      - name: Open or update conflict issue
        if: steps.merge.outputs.conflict == 'true'
        env:
          SHA: ${{ steps.fetch.outputs.sha }}
          FILES: ${{ steps.merge.outputs.files }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$(printf 'Merging [dmmulroy/anti-slop@%s](https://github.com/dmmulroy/anti-slop/commit/%s) into `main` conflicts in:\n\n```\n%s\n```\n\nResolve locally:\n\n```sh\ngit fetch upstream\ngit switch -c %s main\ngit merge upstream/main\n```\n\nThen open a PR into `main`. Run: %s\n' "$SHA" "$SHA" "$FILES" "$SYNC_BRANCH" "$RUN_URL")"
          issue="$(gh issue list --state open --search "in:title \"$CONFLICT_TITLE\"" --json number,title --jq "map(select(.title == \"$CONFLICT_TITLE\")) | .[0].number // empty")"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$CONFLICT_TITLE" --body "$body"
          fi
