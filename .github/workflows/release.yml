name: Release

# On a `v*` tag push: check, build, commit `dist/` on top of the tagged commit,
# move the tag to that commit, and create a GitHub Release. `main` stays
# source-only; only release tags carry `dist/`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify tag matches package.json version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Detect existing build
        id: state
        run: |
          if git ls-tree -d --name-only HEAD dist | grep -qx dist; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.state.outputs.built == 'false'
        run: pnpm install --frozen-lockfile
      # `check` ends with `pnpm build`, so `dist/` exists afterwards.
      - if: steps.state.outputs.built == 'false'
        run: pnpm check
      - if: steps.state.outputs.built == 'false'
        run: test -f dist/src/index.js && test -f dist/windfall/index.js

      - name: Commit dist/ and move the tag
        if: steps.state.outputs.built == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force dist
          git commit --message "build: $TAG"
          git tag --force --annotate "$TAG" --message "$TAG"
          git push --force origin "refs/tags/$TAG"

      - name: Create GitHub Release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          fi
